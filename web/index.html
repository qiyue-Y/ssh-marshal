<!doctype html>
<html lang="zh-CN" data-type="software" data-radius="soft" data-buttons="solid" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ssh-marshal · 主机清单</title>
<meta name="description" content="ssh-marshal 主机清单的本地编辑界面。凭据只在本机读写，保存会直接写入清单文件。">
<meta name="site-kind" content="software">
<meta name="page-type" content="software">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23232323'/%3E%3Ctext x='6' y='21' font-family='monospace' font-size='13' fill='%23a1ffcb'%3E%26gt;_%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="assets/motion/motion.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#main">跳到内容</a>

<header class="app-nav">
  <div class="app-nav__inner">
    <a class="brand" href="#main" aria-label="ssh-marshal 主机清单">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span class="brand-name">ssh-marshal</span>
      <span class="brand-sub">主机清单</span>
    </a>
    <div class="app-nav__actions">
      <span id="file-state" class="file-state">正在读取清单…</span>
      <button type="button" id="reload-btn" class="btn btn--secondary btn--sm">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 6.2A5.6 5.6 0 1 0 13.4 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.5 2.8v3.6H9.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        重新载入
      </button>
      <button type="button" id="shutdown-btn" class="btn btn--secondary btn--sm">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.8H3.6a1 1 0 0 0-1 1v8.4a1 1 0 0 0 1 1H6M10.5 4.5 13.5 8l-3 3.5M13.2 8H6.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        关闭服务
      </button>
    </div>
  </div>
</header>

<main id="main" class="app-layout">
  <aside class="rail" aria-label="主机列表">
    <div class="rail-head">
      <div class="rail-title">
        <h2 class="rail-heading">主机</h2>
        <span id="host-count" class="count">0</span>
      </div>
      <label class="search" for="search-input">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.2 10.2 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" placeholder="按别名、地址或用户筛选" autocomplete="off">
      </label>
    </div>

    <div class="rail-actions">
      <button type="button" id="new-btn" class="btn btn--primary btn--sm">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.8v10.4M2.8 8h10.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        新增主机
      </button>
      <button type="button" id="import-btn" class="btn btn--secondary btn--sm">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.8v7.4M5 7.2 8 10.2l3-3M3 12.6h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        从 ~/.ssh 导入
      </button>
    </div>

    <div id="host-list" class="host-list" role="listbox" aria-label="主机清单"></div>

    <div class="rail-foot">
      <p id="file-path" class="file-path"></p>
    </div>
  </aside>

  <div class="workspace">
    <div id="error-banner" class="banner" hidden></div>

    <div id="empty-state" class="empty">
      <div class="empty-mark" aria-hidden="true">&gt;_</div>
      <h1 class="empty-title">选一台主机开始编辑</h1>
      <p class="empty-text">清单里的口令不会显示在页面上。保存会直接写入清单文件。</p>
      <div class="empty-actions">
        <button type="button" id="empty-new-btn" class="btn btn--primary btn--sm">新增主机</button>
        <button type="button" id="empty-import-btn" class="btn btn--secondary btn--sm">从 ~/.ssh 导入</button>
      </div>
    </div>

    <form id="host-form" class="host-form" novalidate hidden>
      <div class="form-head">
        <div>
          <h1 id="form-title" class="form-title">新建主机</h1>
          <p class="form-subtitle">凭据只有你能改。保存会直接写入清单文件。</p>
        </div>
        <span id="dirty-badge" class="dirty-badge" hidden>未保存</span>
      </div>

      <div class="form-body">
        <section class="form-group">
          <h2 class="group-title">连接</h2>
          <div class="form-grid">
            <label class="field" for="alias">
              <span class="field-label">别名</span>
              <input id="alias" name="alias" type="text" autocomplete="off" spellcheck="false" placeholder="字母、数字与 . _ : @ + -">
            </label>
            <label class="field" for="address">
              <span class="field-label">地址</span>
              <input id="address" name="address" type="text" autocomplete="off" spellcheck="false" placeholder="10.0.0.10">
            </label>
            <label class="field field--port" for="port">
              <span class="field-label">端口</span>
              <input id="port" name="port" type="number" min="1" max="65535" step="1" value="22" inputmode="numeric">
            </label>
            <label class="field" for="username">
              <span class="field-label">用户名</span>
              <input id="username" name="username" type="text" autocomplete="off" spellcheck="false" placeholder="deploy">
            </label>
            <div class="field field--full">
              <span class="field-label">认证方式</span>
              <div class="segmented" role="radiogroup" aria-label="认证方式">
                <label class="segment">
                  <input type="radio" name="auth" value="password" checked>
                  <span>口令</span>
                </label>
                <label class="segment">
                  <input type="radio" name="auth" value="key">
                  <span>私钥</span>
                </label>
              </div>
            </div>
          </div>
        </section>

        <section class="form-group">
          <h2 class="group-title">凭据</h2>
          <div class="form-grid">
            <label class="field field--full" for="password" data-auth="password">
              <span class="field-label">口令</span>
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="留空＝沿用原口令">
              <span id="password-hint" class="field-hint">编辑时留空＝沿用原口令；页面不回填明文。</span>
            </label>
            <label class="field field--full" for="key_path" data-auth="key" hidden>
              <span class="field-label">私钥路径</span>
              <input id="key_path" name="key_path" type="text" autocomplete="off" spellcheck="false" placeholder="可留空：按 ~/.ssh 常见文件名与 ssh-agent 查找">
            </label>
            <div class="field field--full">
              <label class="field-label" for="hostKey">主机指纹 hostKey</label>
              <div class="input-row">
                <input id="hostKey" name="hostKey" class="mono-input" type="text" autocomplete="off" spellcheck="false" placeholder="SHA256:…">
                <button type="button" id="probe-inline" class="btn btn--secondary btn--sm">探测指纹</button>
              </div>
              <span class="field-hint">探测只做密钥交换，不发送任何凭据。与已固定值不一致时不会自动覆盖。</span>
              <div id="probe-result" class="result" aria-live="polite" hidden></div>
            </div>
          </div>
        </section>

        <section class="form-group">
          <h2 class="group-title">能力位</h2>
          <div class="toggles">
            <label class="toggle" for="disabled">
              <input id="disabled" name="disabled" type="checkbox">
              <span class="toggle-text"><strong>停用</strong><small>建连前直接拒绝，凭据仍保留</small></span>
            </label>
            <label class="toggle" for="critical">
              <input id="critical" name="critical" type="checkbox">
              <span class="toggle-text"><strong>恒查清单</strong><small>非 root 账号也检查 killlist</small></span>
            </label>
            <label class="toggle" for="xfer">
              <input id="xfer" name="xfer" type="checkbox" checked>
              <span class="toggle-text"><strong>允许传文件</strong><small>取消勾选＝禁止 put_file / get_file</small></span>
            </label>
            <label class="toggle" for="elevate">
              <input id="elevate" name="elevate" type="checkbox">
              <span class="toggle-text"><strong>允许提权</strong><small>exec 带 elevate=true 时走 sudo -S</small></span>
            </label>
          </div>
        </section>

        <section class="form-group" id="elevate-group" hidden>
          <h2 class="group-title">提权</h2>
          <div class="form-grid">
            <label class="field" for="elevate_user">
              <span class="field-label">提权用户</span>
              <input id="elevate_user" name="elevate_user" type="text" value="root" autocomplete="off" spellcheck="false">
            </label>
            <label class="field" for="elevate_password">
              <span class="field-label">提权口令</span>
              <input id="elevate_password" name="elevate_password" type="password" autocomplete="new-password" placeholder="留空＝沿用登录口令">
            </label>
          </div>
        </section>

        <section class="form-group">
          <h2 class="group-title">环境与备注</h2>
          <div class="form-grid">
            <label class="field field--full" for="shell_init">
              <span class="field-label">初始化片段 shell_init</span>
              <textarea id="shell_init" name="shell_init" class="mono-input" rows="3" spellcheck="false" placeholder="可选：登录会话里先 source 的一段 shell"></textarea>
            </label>
            <label class="field field--full" for="purpose">
              <span class="field-label">备注 purpose</span>
              <textarea id="purpose" name="purpose" rows="2" placeholder="这台机器是做什么的"></textarea>
            </label>
          </div>
        </section>

        <section id="result-panel" class="result" aria-live="polite" hidden></section>
      </div>

      <div class="form-actions">
        <button type="submit" id="save-btn" class="btn btn--primary">保存主机</button>
        <button type="button" id="test-btn" class="btn btn--secondary">测试连接</button>
        <button type="button" id="delete-btn" class="text-danger">从清单删除</button>
        <span class="kbd-hint">Ctrl / ⌘ + S 保存</span>
      </div>
    </form>
  </div>
</main>

<dialog id="import-dialog" class="dialog" aria-labelledby="import-title">
  <div class="dialog-head">
    <div>
      <h2 id="import-title" class="dialog-title">从 ~/.ssh 导入</h2>
      <p class="dialog-sub">扫描 known_hosts 与 ssh config。已在清单里或别名冲突的会置灰；导入后仍需补口令或改用私钥。</p>
    </div>
    <button type="button" class="icon-btn" data-close="import-dialog" aria-label="关闭">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="import-summary" class="dialog-note"></div>
  <div id="import-list" class="import-list"></div>
  <div class="dialog-foot">
    <span id="import-count" class="dialog-note"></span>
    <div class="dialog-actions">
      <button type="button" class="btn btn--secondary btn--sm" data-close="import-dialog">取消</button>
      <button type="button" id="import-confirm" class="btn btn--primary btn--sm">导入选中</button>
    </div>
  </div>
</dialog>

<dialog id="delete-dialog" class="dialog dialog--sm" aria-labelledby="delete-title">
  <div class="dialog-head">
    <div>
      <h2 id="delete-title" class="dialog-title">从清单删除？</h2>
      <p id="delete-text" class="dialog-sub"></p>
    </div>
  </div>
  <div class="dialog-foot">
    <span class="dialog-note">删除会直接写入清单文件，不再生成备份。</span>
    <div class="dialog-actions">
      <button type="button" class="btn btn--secondary btn--sm" data-close="delete-dialog">取消</button>
      <button type="button" id="delete-confirm" class="btn btn--danger btn--sm">删除</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<noscript>
  <p class="noscript">这个页面需要 JavaScript。请用支持 JavaScript 的浏览器打开。</p>
</noscript>

<script type="module" src="app.js"></script>
</body>
</html>
